<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#010619" />
    <title>Cygnus AI Labs — AI Automation, Intelligence &amp; Custom Web Solutions</title>
    
    <!-- Technical SEO & Meta Tags -->
    <meta
      name="description"
      content="Cygnus AI Labs builds custom AI automation for businesses, intelligent agents, and scalable web solutions that streamline workflows and scale operations."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.cygnuslabs.si/" />

    <!-- Open Graph Metadata -->
    <meta property="og:site_name" content="Cygnus AI Labs" />
    <meta property="og:title" content="Cygnus AI Labs — AI Automation, Intelligence &amp; Custom Web Solutions" />
    <meta
      property="og:description"
      content="Custom AI automation for businesses, intelligent workflow systems, applied decision support, and scalable technical implementation."
    />
    <meta property="og:url" content="https://www.cygnuslabs.si/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.cygnuslabs.si/brand/cygnus-logo.png" />
    <meta property="og:image:alt" content="Cygnus AI Labs — AI Automation and Intelligence" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cygnus AI Labs — AI Automation, Intelligence &amp; Custom Web Solutions" />
    <meta
      name="twitter:description"
      content="Custom AI automation for businesses, intelligent workflow systems, and scalable technical implementations."
    />
    <meta name="twitter:image" content="https://www.cygnuslabs.si/brand/cygnus-logo.png" />

    <!-- Brand Assets & Icons -->
    <link rel="icon" type="image/png" sizes="64x64" href="%PUBLIC_URL%/favicon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD): Organization & WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.cygnuslabs.si/#organization",
            "name": "Cygnus AI Labs",
            "legalName": "Cygnus AI Labs",
            "url": "https://www.cygnuslabs.si/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.cygnuslabs.si/brand/cygnus-logo.png",
              "caption": "Cygnus AI Labs Logo"
            },
            "image": "https://www.cygnuslabs.si/brand/cygnus-emblem.png",
            "description": "Cygnus AI Labs specializes in AI automation for businesses, intelligent workflow agents, custom AI integrations, web development, and technical delivery.",
            "email": "business@cygnuslabs.si",
            "contactPoint": [
              {
                "@type": "ContactPoint",
                "email": "business@cygnuslabs.si",
                "contactType": "customer service",
                "availableLanguage": ["en"]
              }
            ],
            "knowsAbout": [
              "AI automation for businesses",
              "Intelligent workflows and AI agents",
              "Business process automation",
              "Custom AI integrations",
              "Web development and technical delivery",
              "Operational efficiency and scaling through automation",
              "Cygnus superintelligence vision"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://www.cygnuslabs.si/#website",
            "url": "https://www.cygnuslabs.si/",
            "name": "Cygnus AI Labs",
            "description": "AI automation, intelligence, and custom web implementation for businesses.",
            "publisher": {
              "@id": "https://www.cygnuslabs.si/#organization"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
